upstream bilm_api {
    server api:8000;
}

server {
    listen 80;
    server_name bilmtechnical.com www.bilmtechnical.com;

    # Redirect HTTP → HTTPS in production (uncomment when SSL is set up)
    # return 301 https://$host$request_uri;

    # Static files
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API
    location /api/ {
        proxy_pass         http://bilm_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }

    # Docs (restrict in production)
    location /docs {
        proxy_pass http://bilm_api;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://bilm_api;
    }

    # Frontend (if serving React from same server)
    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
    }
}
