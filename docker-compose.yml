# Docker Compose — Bilm Technical Services
# Port 5432 mapped to 5433 externally to avoid conflict with local PostgreSQL

services:
  # ── FastAPI Application ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bilm_api
    ports:
      - "8100:8000"          # host:8100 → container:8000
    environment:
      DATABASE_URL: postgresql+asyncpg://bilm:bilmpass@db:5432/bilmdb
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DEBUG: "true"
      SECRET_KEY: ${SECRET_KEY:-CHANGE_THIS_IN_PRODUCTION_PLEASE}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Bilm Technical Services}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    restart: unless-stopped
    networks:
      - bilm_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Celery Worker ─────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bilm_worker
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql+asyncpg://bilm:bilmpass@db:5432/bilmdb
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-CHANGE_THIS_IN_PRODUCTION_PLEASE}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Bilm Technical Services}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    restart: unless-stopped
    networks:
      - bilm_net

  # ── Celery Beat (Scheduler) ───────────────────────────────────────────────
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bilm_beat
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://bilm:bilmpass@db:5432/bilmdb
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: ${SECRET_KEY:-CHANGE_THIS_IN_PRODUCTION_PLEASE}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    restart: unless-stopped
    networks:
      - bilm_net

  # ── Flower (Celery Monitor) ───────────────────────────────────────────────
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bilm_flower
    command: celery -A app.workers.celery_app flower --port=5555
    ports:
      - "5556:5555"           # host:5556 → container:5555
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - bilm_net

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: bilm_db
    environment:
      POSTGRES_USER: bilm
      POSTGRES_PASSWORD: bilmpass
      POSTGRES_DB: bilmdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host port 5433 avoids conflict with any local PostgreSQL on 5432
      # Internal container port stays 5432 — the API connects via Docker network
      - "5434:5432"           # host:5434 → container:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bilm -d bilmdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - bilm_net

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bilm_redis
    ports:
      - "6380:6379"           # host:6380 → container:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - bilm_net

  # ── Nginx (reverse proxy) ─────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: bilm_nginx
    ports:
      - "8080:80"             # host:8080 → container:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - bilm_net

volumes:
  pgdata:

networks:
  bilm_net:
    driver: bridge
